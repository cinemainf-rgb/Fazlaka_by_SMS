<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAZLAKA</title>
<style>
:root{--bg:#EFF6F5;--surface:#fff;--surface2:#E6F0EF;--text:#0F2A28;--muted:#5B7571;--border:#DCE9E7;--primary:#0E5A54;--primary-soft:#DDF3F0;--danger:#C23B31;--danger-soft:#FDF0EE;--success:#0F766E;--success-soft:#E3F5F2}
body.dark{--bg:#0A1E1C;--surface:#122E2B;--surface2:#183A36;--text:#EDF7F5;--muted:#9BB4B0;--border:#234845;--primary:#14B8A6;--primary-soft:#143F3B;--danger:#F08077;--danger-soft:#37201F;--success:#2DD4BF;--success-soft:#143F3B}
*{box-sizing:border-box;font-family:'Cairo',system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}
.latin{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
button{cursor:pointer;border:0;font-family:inherit;background:none;color:inherit}
input,select{font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--primary)!important;box-shadow:0 0 0 3px var(--primary-soft)}
.app{max-width:430px;margin:auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;padding-bottom:92px}
header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:6px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:999px;background:var(--surface2);display:grid;place-items:center;font-size:18px}
main{padding:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;box-shadow:0 1px 2px rgba(11,79,74,.05)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:12px;color:var(--muted)}
.big{font-size:20px;font-weight:600}
.btn{width:100%;padding:12px;border-radius:12px;font-size:14px;font-weight:600}
.btn-primary{background:var(--primary);color:#fff}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.field{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:4px;color:var(--text)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;margin-top:8px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:999px;background:var(--surface2);font-size:18px}
.qty button.plus{background:var(--primary);color:#fff}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:40;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:4px}
nav button{color:var(--muted);font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.active{color:var(--primary);font-weight:600}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);overflow:auto;padding:16px 12px}
.modal-box{max-width:400px;margin:auto;background:var(--surface);border-radius:24px;padding:16px}
.hidden{display:none}
.badge{background:var(--danger-soft);color:var(--danger);font-size:11px;padding:4px 8px;border-radius:999px}
.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0}
.timeline{position:relative;padding-right:18px}
.timeline:before{content:'';position:absolute;right:6px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl{position:relative;padding:10px 0;border-bottom:1px solid var(--border)}
.tl:before{content:'';position:absolute;right:-15px;top:18px;width:9px;height:9px;border-radius:999px;background:var(--primary)}
.wallet-card{border-right:4px solid var(--primary)}
.bar{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
const nowTime=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const fmt=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(n||0);
const money=n=>fmt(n)+' EGP';
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
let S={
hide:load('fz_hide',false),dark:load('fz_dark',false),
tab:'home',page:'',svcTab:'wallets',
shop:load('fz_shop',{name:'FAZLAKA',owner:'صاحب المحل',phone:''}),
wallets:load('fz_wallets',[
{id:'cash',name:'💵 نقدية الدرج',balance:4200,limit:0,type:'cash'},
{id:'w1',name:'📱 فودافون كاش 1',balance:8500,limit:100000,type:'wallet'},
{id:'w2',name:'📱 فودافون كاش 2',balance:3200,limit:100000,type:'wallet'},
{id:'insta',name:'🏦 إنستا باي',balance:12500,limit:400000,type:'wallet'},
{id:'orange',name:'🟠 أورنج كاش',balance:1800,limit:100000,type:'wallet'},
{id:'etisalat',name:'🟢 اتصالات كاش',balance:1400,limit:100000,type:'wallet'},
{id:'we',name:'🔵 WE Pay',balance:900,limit:50000,type:'wallet'},
]),
products:load('fz_products',[
{id:1,name:'شاحن سامسونج',buy:120,sell:180,qty:15,threshold:5,cat:'شواحن'},
{id:2,name:'جراب ايفون',buy:35,sell:75,qty:2,threshold:5,cat:'جرابات'},
{id:3,name:'كابل تايب سي',buy:30,sell:65,qty:1,threshold:5,cat:'كابلات'},
{id:4,name:'جراب سيليكون',buy:35,sell:75,qty:8,threshold:5,cat:'جرابات'},
{id:5,name:'سماعة بلوتوث',buy:220,sell:380,qty:6,threshold:3,cat:'سماعات'},
{id:6,name:'سكرين حماية',buy:20,sell:50,qty:12,threshold:5,cat:'حماية'},
]),
moves:load('fz_moves',[]),
sales:load('fz_sales',[]),expenses:load('fz_expenses',[]),
customers:load('fz_customers',[{id:1,name:'أحمد سامي',phone:'01001112222',debt:450}]),
suppliers:load('fz_suppliers',[{id:1,name:'مورد الشواحن',phone:'01225556666',debt:1200}]),
cart:{},search:'',cat:'الكل',
svc:{walletId:'w1',dir:'وارد',amount:'',comm:'',note:''},
mach:{company:'فوري',op:'شحن',amount:'',comm:''},
ship:{network:'فودافون',phone:'',amount:'',comm:''},
bills:{type:'كهرباء',amount:'',comm:'',note:''},
buyForm:{supplierId:1,productId:1,qty:'',cost:''},
exp:{name:'',amount:'',cat:'إيجار'},
toast:'',pinInput:'',pinMsg:'',
};
function persist(){['wallets','products','moves','sales','expenses','customers','suppliers','shop','hide','dark'].forEach(k=>save('fz_'+k,S[k]));}
function show(v){return S.hide?'****':money(v)}
function wallet(id){return S.wallets.find(w=>w.id===id)}
function addMove(title,detail,amount){S.moves.unshift({id:Date.now()+Math.random(),date:today(),time:nowTime(),title,detail,amount:amount||0});}
function lowStock(){return S.products.filter(p=>p.qty<=p.threshold)}
function lowWallets(){return S.wallets.filter(w=>w.type!=='cash'&&w.balance<2000)}
function todayMoves(){return S.moves.filter(m=>m.date===today())}
 function render(){
document.body.classList.toggle('dark',S.dark);
const app=$('#app');
app.innerHTML=`
<div class="app"><header>
<div class="logo">F</div>
<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:15px">${esc(S.shop.name)}</div><div class="small">${esc(S.shop.owner)} • <span class="latin">${today()}</span></div></div>
<button class="icon-btn" onclick="toggleHide()">${S.hide?'🙈':'👁️'}</button>
<button class="icon-btn" onclick="toggleDark()">${S.dark?'☀️':'🌙'}</button>
</header><main>${S.page?pageHTML(S.page):tabHTML(S.tab)}</main>
${S.toast?`<div class="card" style="margin:0 12px;background:var(--success-soft);color:var(--success)">${esc(S.toast)}</div>`:''}
<nav>${[['home','🏠','الرئيسية'],['services','💳','الخدمات'],['stock','📦','المخزون'],['reports','📊','التقارير'],['more','☰','المزيد']].map(t=>`<button class="${(S.tab===t[0]||(t[0]==='more'&&S.page))?'active':''}" onclick="${t[0]==='more'?'openMenu()':t[0]==='reports'?"goPage('reports')":`go('${t[0]}')`}">${t[1]}<span>${t[2]}</span></button>`).join('')}</nav></div>
<div id="menu" class="modal hidden"><div class="modal-box">
<div class="row"><b>☰ المزيد</b><button class="icon-btn" onclick="closeMenu()">✕</button></div>
${[['money','💰 فلوسي'],['customers','👥 العملاء'],['suppliers','🏭 الموردين'],['expenses','🧾 المصروفات'],['log','🕒 سجل الحركة'],['low','⚠️ النواقص'],['buy','🛒 شراء بضاعة'],['reports','📊 التقارير'],['settings','⚙️ الإعدادات'],['backup','💾 النسخ الاحتياطي']].map(m=>`<button class="btn" style="background:var(--surface2);margin-top:8px;text-align:right" onclick="goPage('${m[0]}')">${m[1]}</button>`).join('')}
</div></div>
<div id="productModal" class="modal hidden"></div>`;
}
function tabHTML(tab){
if(tab==='home'){
const salesToday=S.sales.filter(s=>s.date===today()).reduce((a,x)=>a+x.total,0);
const profitToday=S.sales.filter(s=>s.date===today()).reduce((a,x)=>a+x.profit,0);
const svcComm=S.moves.filter(m=>m.date===today()&&m.detail.includes('عمولة')).reduce((a,x)=>a+x.amount,0);
const expToday=S.expenses.filter(e=>e.date===today()).reduce((a,x)=>a+x.amount,0);
const netToday=profitToday+svcComm-expToday;
return `<h2 style="font-size:19px;margin:0">أهلاً بيك، ${esc(S.shop.owner)}</h2><p class="small">ملخص اليوم</p>
${S.wallets.map(w=>{const pct=w.limit?Math.min(100,Math.round(w.balance/w.limit*100)):100;return `<div class="card wallet-card" style="margin-top:8px"><div class="row"><b>${esc(w.name)}</b><span class="small">المتاح: ${show(w.balance)}</span></div>
<div class="row" style="font-size:12px;margin-top:8px"><span>الرصيد: ${show(w.balance)}</span><span>الليمت: ${w.limit?show(w.limit):'—'}</span></div>
${w.limit?`<div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div><div class="small" style="margin-top:4px">استهلاك الليمت: <span class="latin">${pct}%</span></div>`:''}</div>`}).join('')}
<div class="grid2" style="margin-top:12px">
<div class="card"><div class="small">مبيعات الإكسسوارات</div><div class="big">${show(salesToday)}</div><div class="small">ربح ${show(profitToday)}</div></div>
<div class="card"><div class="small">عمولات الخدمات</div><div class="big" style="color:var(--primary)">${show(svcComm)}</div></div>
<div class="card"><div class="small">المصاريف</div><div class="big" style="color:var(--danger)">${show(expToday)}</div></div>
<div class="card"><div class="small">صافي اليوم</div><div class="big" style="color:var(--success)">${show(netToday)}</div></div>
</div>
<div class="card" style="margin-top:12px"><b>⚠️ التنبيهات</b>
${lowStock().length?lowStock().map(p=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--border)"><span>ناقص: ${esc(p.name)} - باقي <span class="latin">${p.qty}</span></span><span class="badge">ناقص</span></div>`).join(''):''}
${lowWallets().map(w=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--border)"><span>رصيد منخفض: ${esc(w.name)}</span><span class="badge">منخفض</span></div>`).join('')}
${!lowStock().length&&!lowWallets().length?'<p class="small">مفيش تنبيهات - كله تمام.</p>':''}
</div>
<div class="card" style="margin-top:12px"><b>🕒 آخر الحركة</b>${todayMoves().slice(0,4).map(m=>`<div class="row" style="padding:6px 0;font-size:13px"><span><span class="latin">${m.time}</span> - ${esc(m.title)}</span><span>${show(m.amount)}</span></div>`).join('')||'<p class="small">لسه مفيش حركة النهارده.</p>'}</div>`;
}
if(tab==='services'){
return `<h2 style="font-size:19px;margin:0">💳 الخدمات</h2>
<div class="tabs">${[['wallets','المحافظ'],['ship','الشحن'],['bills','الفواتير'],['mach','المكن']].map(t=>`<button class="chip ${S.svcTab===t[0]?'active':''}" onclick="S.svcTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
${S.svcTab==='wallets'?servicesWallets():S.svcTab==='mach'?servicesMach():S.svcTab==='ship'?servicesShip():servicesBills()}`;
}
if(tab==='stock'){
const list=S.products.filter(p=>(S.cat==='الكل'||p.cat===S.cat)&&(p.name.includes(S.search)));
const cartItems=Object.entries(S.cart).map(([id,qty])=>({p:S.products.find(x=>x.id==Number(id)),qty})).filter(x=>x.p);
const total=cartItems.reduce((a,x)=>a+x.p.sell*x.qty,0),profit=cartItems.reduce((a,x)=>a+(x.p.sell-x.p.buy)*x.qty,0);
const cats=['الكل',...new Set(S.products.map(p=>p.cat))];
return `<div class="row"><div><h2 style="font-size:19px;margin:0">📦 المخزون</h2></div><button class="btn btn-primary" style="width:auto;padding:8px 12px" onclick="openProduct()">+ منتج</button></div>
<div class="tabs">${cats.map(c=>`<button class="chip ${S.cat===c?'active':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div>
<input class="field" value="${esc(S.search)}" placeholder="دور بالاسم" oninput="S.search=this.value;render()">
${list.map(p=>`<div class="item"><div style="flex:1"><b>${esc(p.name)}</b><div class="small">${esc(p.cat)} • شراء ${show(p.buy)} • بيع ${show(p.sell)}</div><div style="font-size:12px">العدد: <span class="latin">${p.qty}</span> ${p.qty<=p.threshold?'<span style="color:var(--danger)">• ناقص</span>':''}</div></div><div class="qty"><button onclick="changeCart(${p.id},-1)">−</button><span class="latin" style="width:22px;text-align:center">${S.cart[p.id]||0}</span><button class="plus" onclick="changeCart(${p.id},1)">+</button></div><button class="icon-btn" onclick="openProduct(${p.id})">✏️</button></div>`).join('')||'<p class="small" style="text-align:center;padding:24px">مفيش منتج.</p>'}
<div class="card" style="margin-top:12px"><b>البيع</b>
<label style="font-size:13px">طريقة الدفع<select class="field" id="payMethod"><option>كاش</option><option>محفظة</option><option>آجل</option></select></label>
<div class="row" style="margin-top:10px"><span>الإجمالي</span><b>${show(total)}</b></div><div class="row small"><span>الربح</span><span>${show(profit)}</span></div>
<button class="btn btn-primary" style="margin-top:10px" onclick="checkout()">🛒 إتمام البيع</button></div>`;
}
if(tab==='money'){
return `<h2 style="font-size:19px;margin:0">💰 فلوسي</h2>
<div class="grid2" style="margin-top:12px"><div class="card"><div class="small">لينا عند العملاء</div><div class="big">${show(S.customers.reduce((a,c)=>a+c.debt,0))}</div></div><div class="card"><div class="small">علينا للموردين</div><div class="big" style="color:var(--danger)">${show(S.suppliers.reduce((a,c)=>a+c.debt,0))}</div></div></div>
<div class="card" style="margin-top:12px"><b>أضف مصروف</b><input class="field" value="${esc(S.exp.name)}" placeholder="اسم المصروف" oninput="S.exp.name=this.value"><input class="field latin" inputmode="numeric" value="${esc(S.exp.amount)}" placeholder="المبلغ" oninput="S.exp.amount=this.value.replace(/[^0-9]/g,'')"><button class="btn btn-primary" style="margin-top:8px" onclick="addExpense()">إضافة</button></div>
<h3>المصاريف الأخيرة</h3>${S.expenses.slice(0,5).map(e=>`<div class="item"><div style="flex:1"><b>${esc(e.title)}</b><div class="small">${esc(e.category)} • <span class="latin">${e.date}</span></div></div><b>${show(e.amount)}</b></div>`).join('')}`;
}
return '';
}
function servicesWallets(){
return `<div class="card"><b>المحافظ</b><button class="btn btn-primary" style="margin-top:8px" onclick="addWallet()">+ محفظة جديدة</button></div>
${S.wallets.map(w=>`<div class="card" style="margin-top:8px"><div class="row"><b>${esc(w.name)}</b><span><button class="icon-btn" onclick="renameWallet('${w.id}')">✏️</button></span></div><div class="row small"><span>الرصيد: ${show(w.balance)}</span><span>الليمت: ${w.limit?show(w.limit):'—'}</span></div></div>`).join('')}
<div class="card" style="margin-top:12px"><b>حركة محفظة - وارد / صادر</b>
<label style="font-size:13px">اختيار المحفظة<select class="field" onchange="S.svc.walletId=this.value">${S.wallets.map(w=>`<option value="${w.id}" ${S.svc.walletId===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></label>
<div class="row" style="margin-top:8px"><button class="chip ${S.svc.dir==='وارد'?'active':''}" onclick="S.svc.dir='وارد';render()">⬇️ وارد</button><button class="chip ${S.svc.dir==='صادر'?'active':''}" onclick="S.svc.dir='صادر';render()">⬆️ صادر</button></div>
<label style="font-size:13px">المبلغ<input class="field latin" inputmode="numeric" value="${esc(S.svc.amount)}" oninput="S.svc.amount=this.value.replace(/[^0-9]/g,'')"></label>
<label style="font-size:13px">العمولة<input class="field latin" inputmode="numeric" value="${esc(S.svc.comm)}" oninput="S.svc.comm=this.value.replace(/[^0-9]/g,'')"></label>
<button class="btn btn-primary" style="margin-top:10px" onclick="doWalletMove()">تنفيذ الحركة</button></div>`;
}
function servicesMach(){
return `<div class="card"><b>المكن</b><div class="tabs">${['فوري','أمان','مصاري'].map(c=>`<button class="chip ${S.mach.company===c?'active':''}" onclick="S.mach.company='${c}';render()">${c}</button>`).join('')}</div>
<label style="font-size:13px">نوع العملية<input class="field" value="${esc(S.mach.op)}" oninput="S.mach.op=this.value"></label>
<label style="font-size:13px">المبلغ<input class="field latin" inputmode="numeric" value="${esc(S.mach.amount)}" oninput="S.mach.amount=this.value.replace(/[^0-9]/g,'')"></label>
<label style="font-size:13px">العمولة<input class="field latin" inputmode="numeric" value="${esc(S.mach.comm)}" oninput="S.mach.comm=this.value.replace(/[^0-9]/g,'')"></label>
<button class="btn btn-primary" style="margin-top:10px" onclick="doMach()">تنفيذ</button></div>`;
}
function servicesShip(){
return `<div class="card"><b>الشحن</b><div class="tabs">${['فودافون','اتصالات','اورنج','WE'].map(n=>`<button class="chip ${S.ship.network===n?'active':''}" onclick="S.ship.network='${n}';render()">${n}</button>`).join('')}</div>
<label style="font-size:13px">الرقم<input class="field latin" inputmode="tel" value="${esc(S.ship.phone)}" oninput="S.ship.phone=this.value"></label>
<label style="font-size:13px">المبلغ<input class="field latin" inputmode="numeric" value="${esc(S.ship.amount)}" oninput="S.ship.amount=this.value.replace(/[^0-9]/g,'')"></label>
<label style="font-size:13px">العمولة<input class="field latin" inputmode="numeric" value="${esc(S.ship.comm)}" oninput="S.ship.comm=this.value.replace(/[^0-9]/g,'')"></label>
<button class="btn btn-primary" style="margin-top:10px" onclick="doShip()">شحن</button></div>`;
}
function servicesBills(){
return `<div class="card"><b>الفواتير</b><div class="tabs">${['كهرباء','مياه','غاز','إنترنت'].map(b=>`<button class="chip ${S.bills.type===b?'active':''}" onclick="S.bills.type='${b}';render()">${b}</button>`).join('')}</div>
<label style="font-size:13px">المبلغ<input class="field latin" inputmode="numeric" value="${esc(S.bills.amount)}" oninput="S.bills.amount=this.value.replace(/[^0-9]/g,'')"></label>
<label style="font-size:13px">العمولة<input class="field latin" inputmode="numeric" value="${esc(S.bills.comm)}" oninput="S.bills.comm=this.value.replace(/[^0-9]/g,'')"></label>
<button class="btn btn-primary" style="margin-top:10px" onclick="doBill()">دفع الفاتورة</button></div>`;
}
function doBill(){
const amt=Number(S.bills.amount)||0;if(!amt){S.toast='اكتب مبلغ';render();return;}
const comm=Number(S.bills.comm)||0;const cash=wallet('cash');cash.balance+=comm;
addMove('دفع فاتورة',`دفع ${S.bills.type} - ${money(amt)}`,amt);
if(comm)addMove('عمولة خدمة',`عمولة ${money(comm)} - ${S.bills.type}`,comm);
S.bills.amount='';S.bills.comm='';S.toast='تم الدفع';persist();render();
}
function pageHTML(page){
if(page==='reports'){
const dSales=S.sales.filter(s=>s.date===today()),dProfit=dSales.reduce((a,x)=>a+x.profit,0),dTotal=dSales.reduce((a,x)=>a+x.total,0);
const dExp=S.expenses.filter(e=>e.date===today()).reduce((a,x)=>a+x.amount,0),dComm=S.moves.filter(m=>m.date===today()&&m.detail.includes('عمولة')).reduce((a,x)=>a+x.amount,0);
return `<button onclick="go('home')">← رجوع</button><h2>📊 التقارير</h2>
<div class="grid2"><div class="card"><div class="small">مبيعات اليوم</div><div class="big">${show(dTotal)}</div></div><div class="card"><div class="small">أرباح اليوم</div><div class="big">${show(dProfit)}</div></div><div class="card"><div class="small">مصاريف اليوم</div><div class="big">${show(dExp)}</div></div><div class="card"><div class="small">عمولات اليوم</div><div class="big">${show(dComm)}</div></div></div>
<div class="card" style="margin-top:12px"><b>المخزون</b><div class="row small"><span>قيمة الشراء</span><span>${show(S.products.reduce((a,p)=>a+p.buy*p.qty,0))}</span></div><div class="row small"><span>قيمة البيع</span><span>${show(S.products.reduce((a,p)=>a+p.sell*p.qty,0))}</span></div></div>`;
}
if(page==='money'){S.tab='money';S.page='';return tabHTML('money');}
if(page==='customers')return `<button onclick="go('home')">← رجوع</button><h2>العملاء</h2><button class="btn btn-primary" onclick="addPerson('customers')">+ عميل</button>${S.customers.map(c=>`<div class="card" style="margin-top:10px"><div class="row"><b>${esc(c.name)}</b><b style="color:var(--danger)">${show(c.debt)}</b></div><div class="small latin">${esc(c.phone)}</div><div class="row" style="margin-top:8px"><input class="field latin" style="margin:0" placeholder="سداد" id="pay-c-${c.id}"><button class="btn btn-primary" style="width:auto;padding:8px 14px" onclick="pay('customers',${c.id})">سداد</button><button class="icon-btn" onclick="delPerson('customers',${c.id})">🗑️</button></div></div>`).join('')}`;
if(page==='suppliers')return `<button onclick="go('home')">← رجوع</button><h2>الموردين</h2><button class="btn btn-primary" onclick="addPerson('suppliers')">+ مورد</button>${S.suppliers.map(c=>`<div class="card" style="margin-top:10px"><div class="row"><b>${esc(c.name)}</b><b style="color:var(--danger)">${show(c.debt)}</b></div><div class="small latin">${esc(c.phone)}</div><div class="row" style="margin-top:8px"><input class="field latin" style="margin:0" placeholder="سداد" id="pay-s-${c.id}"><button class="btn btn-primary" style="width:auto;padding:8px 14px" onclick="pay('suppliers',${c.id})">سداد</button><button class="icon-btn" onclick="delPerson('suppliers',${c.id})">🗑️</button></div></div>`).join('')}`;
if(page==='log')return `<button onclick="go('home')">← رجوع</button><h2>🕒 سجل الحركة</h2><div class="timeline">${S.moves.slice(0,50).map(m=>`<div class="tl"><div class="row"><b>${esc(m.title)}</b><span class="latin small">${m.time}</span></div><div class="small">${esc(m.detail)} • <span class="latin">${m.date}</span></div><div>${show(m.amount)}</div></div>`).join('')||'<p class="small">مفيش حركة.</p>'}</div>`;
if(page==='low')return `<button onclick="go('home')">← رجوع</button><h2>⚠️ النواقص</h2>${lowStock().map(p=>`<div class="card" style="margin-top:8px"><div class="row"><b>${esc(p.name)}</b><span class="badge">باقي <span class="latin">${p.qty}</span></span></div></div>`).join('')||'<p class="small">مفيش نواقص.</p>'}`;
if(page==='buy')return `<button onclick="go('home')">← رجوع</button><h2>🛒 شراء بضاعة</h2><div class="card"><label style="font-size:13px">المورد<select class="field" onchange="S.buyForm.supplierId=Number(this.value)">${S.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label style="font-size:13px">المنتج<select class="field" onchange="S.buyForm.productId=Number(this.value)">${S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label style="font-size:13px">الكمية<input class="field latin" inputmode="numeric" value="${esc(S.buyForm.qty)}" oninput="S.buyForm.qty=this.value.replace(/[^0-9]/g,'')"></label><label style="font-size:13px">التكلفة<input class="field latin" inputmode="numeric" value="${esc(S.buyForm.cost)}" oninput="S.buyForm.cost=this.value.replace(/[^0-9]/g,'')"></label><button class="btn btn-primary" style="margin-top:10px" onclick="doBuy()">شراء</button></div>`;
if(page==='expenses')return `<button onclick="go('home')">← رجوع</button><h2>🧾 المصروفات</h2><div class="card"><input class="field" value="${esc(S.exp.name)}" placeholder="اسم المصروف" oninput="S.exp.name=this.value"><input class="field latin" inputmode="numeric" value="${esc(S.exp.amount)}" placeholder="المبلغ" oninput="S.exp.amount=this.value.replace(/[^0-9]/g,'')"><button class="btn btn-primary" style="margin-top:8px" onclick="addExpense()">إضافة</button></div>${S.expenses.map(e=>`<div class="item"><div style="flex:1"><b>${esc(e.title)}</b><div class="small"><span class="latin">${e.date}</span></div></div><b>${show(e.amount)}</b></div>`).join('')}`;
if(page==='settings')return `<button onclick="go('home')">← رجوع</button><h2>⚙️ الإعدادات</h2>
<div class="card" style="margin-top:10px"><b>معلومات المحل</b><label style="font-size:13px">اسم المحل<input class="field" value="${esc(S.shop.name)}" oninput="S.shop.name=this.value;persist()"></label><label style="font-size:13px">صاحب المحل<input class="field" value="${esc(S.shop.owner)}" oninput="S.shop.owner=this.value;persist()"></label></div>
<div class="card" style="margin-top:10px"><b>الأمان</b><p class="small">الـ PIN بيتغير من شاشة القفل الأصلية - لو عايز تغيره، اقفل التطبيق وافتحه، ودوس على تغيير PIN من الإعدادات هناك.</p><div class="row" style="margin-top:12px"><span>الوضع الليلي</span><button class="chip ${S.dark?'active':''}" onclick="toggleDark()">${S.dark?'شغال':'مقفول'}</button></div><div class="row" style="margin-top:8px"><span>إخفاء الأرقام</span><button class="chip ${S.hide?'active':''}" onclick="toggleHide()">${S.hide?'مخفي':'ظاهر'}</button></div></div>`;
if(page==='backup')return `<button onclick="go('home')">← رجوع</button><h2>💾 النسخ الاحتياطي</h2><div class="card"><button class="btn" style="background:var(--surface2)" onclick="exportData()">📥 تصدير</button><label class="btn" style="background:var(--surface2);margin-top:8px;display:block;text-align:center">📤 استيراد<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label></div>`;
return '';
}
function go(tab){S.tab=tab;S.page='';S.toast='';render();window.scrollTo({top:0})}
function goPage(p){S.page=p;closeMenu();render();window.scrollTo({top:0})}
function openMenu(){$('#menu').classList.remove('hidden')}
function closeMenu(){const m=$('#menu');if(m)m.classList.add('hidden')}
function toggleHide(){S.hide=!S.hide;persist();render()}
function toggleDark(){S.dark=!S.dark;persist();render()}
function changeCart(id,d){const p=S.products.find(x=>x.id===id);if(!p)return;let q=(S.cart[id]||0)+d;if(q<0)q=0;if(q>p.qty)q=p.qty;if(q===0)delete S.cart[id];else S.cart[id]=q;render();}
function checkout(){
const items=Object.entries(S.cart).map(([id,qty])=>({p:S.products.find(x=>x.id==Number(id)),qty})).filter(x=>x.p);if(!items.length){S.toast='السلة فاضية';render();return;}
const total=items.reduce((a,x)=>a+x.p.sell*x.qty,0),profit=items.reduce((a,x)=>a+(x.p.sell-x.p.buy)*x.qty,0);
const method=document.getElementById('payMethod')?.value||'كاش';
if(method==='كاش'){const cash=wallet('cash');cash.balance+=total;}
else if(method==='محفظة'){const w=wallet('w1');w.balance+=total;}
else if(method==='آجل'){const c=S.customers[0];if(c)c.debt+=total;}
S.sales.unshift({id:Date.now(),date:today(),items:items.map(x=>({productId:x.p.id,name:x.p.name,qty:x.qty,price:x.p.sell})),total,profit,method});
items.forEach(x=>x.p.qty=Math.max(0,x.p.qty-x.qty));S.cart={};
addMove('بيع',`بيع ${items.map(i=>i.p.name).join(' + ')} - ${method}`,total);
S.toast=`تم البيع - ${money(total)}`;persist();render();
}
function doWalletMove(){
const amt=Number(S.svc.amount)||0;if(!amt){S.toast='اكتب مبلغ';render();return;}
const w=wallet(S.svc.walletId);const comm=Number(S.svc.comm)||0;
if(S.svc.dir==='وارد'){w.balance+=amt;addMove('وارد',`وارد ${money(amt)} على ${w.name}`,amt);}
else{w.balance=Math.max(0,w.balance-amt);addMove('صادر',`صادر ${money(amt)} من ${w.name}`,amt);}
if(comm)addMove('عمولة خدمة',`عمولة ${money(comm)} على ${w.name}`,comm);
S.svc.amount='';S.svc.comm='';S.toast='تمت الحركة';persist();render();
}
function doMach(){
const amt=Number(S.mach.amount)||0;if(!amt){S.toast='اكتب مبلغ';render();return;}
const comm=Number(S.mach.comm)||0;const cash=wallet('cash');cash.balance+=comm;
addMove(`مكن ${S.mach.company}`,`${S.mach.op} - ${money(amt)}`,amt);
if(comm)addMove('عمولة خدمة',`عمولة ${money(comm)}`,comm);
S.mach.amount='';S.mach.comm='';S.toast='تمت العملية';persist();render();
}
function doShip(){
const amt=Number(S.ship.amount)||0;if(!amt||!S.ship.phone){S.toast='اكتب الرقم والمبلغ';render();return;}
const comm=Number(S.ship.comm)||0;
addMove('شحن رصيد',`شحن ${S.ship.network} - ${S.ship.phone} - ${money(amt)}`,amt);
if(comm)addMove('عمولة خدمة',`عمولة ${money(comm)}`,comm);
S.ship.phone='';S.ship.amount='';S.ship.comm='';S.toast='تم الشحن';persist();render();
}
function addExpense(){if(!S.exp.name||!S.exp.amount){S.toast='اكتب الاسم والمبلغ';render();return;}S.expenses.unshift({id:Date.now(),title:S.exp.name,category:S.exp.cat,amount:Number(S.exp.amount),date:today()});addMove('مصروف',`${S.exp.name}`,Number(S.exp.amount));S.exp.name='';S.exp.amount='';S.toast='تم الإضافة';persist();render();}
function doBuy(){
const qty=Number(S.buyForm.qty)||0,cost=Number(S.buyForm.cost)||0;if(!qty||!cost){S.toast='اكتب الكمية والتكلفة';render();return;}
const p=S.products.find(x=>x.id===S.buyForm.productId);if(!p)return;p.qty+=qty;
const sup=S.suppliers.find(x=>x.id===S.buyForm.supplierId);if(sup)sup.debt+=cost;
addMove('شراء بضاعة',`شراء ${qty} × ${p.name}`,cost);
S.buyForm.qty='';S.buyForm.cost='';S.toast='تم الشراء';persist();render();
}
function addWallet(){const name=prompt('اسم المحفظة');if(!name)return;const limit=Number(prompt('الليمت')||0)||0;S.wallets.push({id:'w'+Date.now(),name,balance:0,limit,type:'wallet'});persist();render();}
function renameWallet(id){const w=wallet(id);const n=prompt('الاسم الجديد',w.name);if(!n)return;w.name=n;persist();render();}
function openProduct(id){
const p=id?S.products.find(x=>x.id===id):null;const m=$('#productModal');m.classList.remove('hidden');
m.innerHTML=`<div class="modal-box"><div class="row"><b>${p?'تعديل منتج':'منتج جديد'}</b><button class="icon-btn" onclick="closeProduct()">✕</button></div>
<label style="font-size:13px">اسم المنتج<input class="field" id="f-name" value="${p?esc(p.name):''}"></label>
<label style="font-size:13px">التصنيف<input class="field" id="f-cat" value="${p?esc(p.cat):'جرابات'}"></label>
<div class="grid2"><label style="font-size:13px">سعر الشراء<input class="field latin" id="f-buy" inputmode="numeric" value="${p?p.buy:''}"></label><label style="font-size:13px">سعر البيع<input class="field latin" id="f-sell" inputmode="numeric" value="${p?p.sell:''}"></label><label style="font-size:13px">العدد<input class="field latin" id="f-qty" inputmode="numeric" value="${p?p.qty:''}"></label><label style="font-size:13px">حد النواقص<input class="field latin" id="f-thr" inputmode="numeric" value="${p?p.threshold:5}"></label></div>
<button class="btn btn-primary" style="margin-top:10px" onclick="saveProduct(${p?p.id:'null'})">حفظ</button></div>`;
}
function closeProduct(){$('#productModal').classList.add('hidden')}
function saveProduct(id){const v=i=>document.getElementById(i).value;if(!v('f-name'))return;const d={name:v('f-name'),cat:v('f-cat'),buy:Number(v('f-buy')||0),sell:Number(v('f-sell')||0),qty:Number(v('f-qty')||0),threshold:Number(v('f-thr')||5)};if(id)S.products=S.products.map(p=>p.id===id?{...p,...d}:p);else S.products.push({id:Date.now(),...d});persist();closeProduct();render();}
function addPerson(kind){const name=prompt(kind==='customers'?'اسم العميل':'اسم المورد');if(!name)return;const phone=prompt('رقم الموبايل')||'';const debt=Number(prompt('الدين')||0)||0;S[kind].push({id:Date.now(),name,phone,debt});persist();render();}
function delPerson(kind,id){S[kind]=S[kind].filter(x=>x.id!==id);persist();render();}
function pay(kind,id){const input=document.getElementById(kind==='customers'?`pay-c-${id}`:`pay-s-${id}`);const amt=Number(input?.value)||0;if(!amt)return;S[kind]=S[kind].map(x=>x.id===id?{...x,debt:Math.max(0,x.debt-amt)}:x);persist();render();}
function exportData(){const data={shop:S.shop,wallets:S.wallets,products:S.products,customers:S.customers,suppliers:S.suppliers,expenses:S.expenses,sales:S.sales,moves:S.moves};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fazlaka.json';a.click();}
function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(String(r.result));if(d.wallets)S.wallets=d.wallets;if(d.products)S.products=d.products;if(d.customers)S.customers=d.customers;if(d.suppliers)S.suppliers=d.suppliers;if(d.expenses)S.expenses=d.expenses;if(d.sales)S.sales=d.sales;if(d.moves)S.moves=d.moves;persist();S.toast='تم الاستيراد';render();}catch{alert('الملف مش صحيح')}};r.readAsText(f);}
render();
</script>
</body>
</html>
